<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#e1251b" />
    <title>京东秒杀 — 整点开抢 · 爆款直降 | 京选商城</title>
    <meta
      name="description"
      content="京东秒杀页仿站作品：每日多场整点秒杀，实时倒计时与库存进度，纯原生 JavaScript 实现。"
    />
    <link rel="stylesheet" href="assets/css/tokens.css" />
    <link rel="stylesheet" href="assets/css/layout.css" />
    <link rel="stylesheet" href="assets/css/components.css" />
    <link rel="stylesheet" href="assets/css/views/seckill.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">跳到主要内容</a>

    <div data-component="header"></div>

    <main id="main">
      <div class="container">
        <section class="page-hero">
          <div class="page-hero__body">
            <p class="page-hero__eyebrow">限时抢购</p>
            <h1 class="page-hero__title">京东秒杀</h1>
            <p class="page-hero__desc">
              每天 4 场整点开抢，爆款直降低至一折。库存实时递减，售完即止。
            </p>
          </div>
          <div class="page-hero__timer">
            <p class="page-hero__timer-label">本场剩余时间</p>
            <time
              class="countdown countdown--light"
              data-countdown
              aria-label="本场秒杀剩余时间"
            ></time>
          </div>
        </section>

        <nav class="sessions" data-sessions aria-label="秒杀场次"></nav>

        <section class="section" aria-labelledby="seckill-title">
          <div class="floor__head">
            <h2 class="floor__title" id="seckill-title">本场好货</h2>
            <span class="floor__desc" data-seckill-count></span>
            <div class="chips" role="group" aria-label="价格筛选">
              <button type="button" class="chip is-active" data-price="all">全部</button>
              <button type="button" class="chip" data-price="low">100 元以下</button>
              <button type="button" class="chip" data-price="mid">100 - 500 元</button>
              <button type="button" class="chip" data-price="high">500 元以上</button>
            </div>
          </div>
          <div class="seckill-grid" data-seckill-grid></div>
        </section>

        <section class="rules" aria-labelledby="rules-title">
          <h2 class="sr-only" id="rules-title">秒杀规则</h2>
          <div class="rule">
            <span class="rule__no">1</span>
            <div>
              <p class="rule__title">整点开抢</p>
              <p class="rule__desc">每天 4 场，开抢前 5 分钟可加入提醒，到点自动开始。</p>
            </div>
          </div>
          <div class="rule">
            <span class="rule__no">2</span>
            <div>
              <p class="rule__title">限量供应</p>
              <p class="rule__desc">每场库存有限，下单后 15 分钟内未支付订单将自动释放。</p>
            </div>
          </div>
          <div class="rule">
            <span class="rule__no">3</span>
            <div>
              <p class="rule__title">价保服务</p>
              <p class="rule__desc">秒杀商品支持 7 天价保，降价可申请差额补偿。</p>
            </div>
          </div>
        </section>
      </div>
    </main>

    <div data-component="footer"></div>

    <script src="assets/js/core.js"></script>
    <script src="assets/js/data.js"></script>
    <script src="assets/js/markup.js"></script>
    <script src="assets/js/views/seckill.js"></script>
  </body>
</html>
