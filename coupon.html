<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#e1251b" />
    <title>领券中心 — 品类券 · 平台券可叠加 | 京选商城</title>
    <meta
      name="description"
      content="领券中心仿站作品：按品类筛选优惠券，一键领取并本地记录状态，纯原生 JavaScript 实现。"
    />
    <link rel="stylesheet" href="assets/css/tokens.css" />
    <link rel="stylesheet" href="assets/css/layout.css" />
    <link rel="stylesheet" href="assets/css/components.css" />
    <link rel="stylesheet" href="assets/css/views/coupon.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">跳到主要内容</a>

    <div data-component="header"></div>

    <main id="main">
      <div class="container">
        <section class="coupon-hero">
          <div>
            <h1 class="coupon-hero__title">领券中心</h1>
            <p class="coupon-hero__desc">
              每日更新，品类券与平台券可叠加使用。领取后自动存入账户，下单时勾选即可抵扣，过期自动失效。
            </p>
          </div>
          <div class="coupon-hero__stats" data-coupon-stats></div>
        </section>

        <div class="coupon-filter">
          <span class="coupon-filter__label">品类筛选</span>
          <div class="chips" data-type-chips role="group" aria-label="品类筛选"></div>
          <span class="coupon-filter__count" data-coupon-count></span>
        </div>

        <div class="coupon-grid" data-coupon-grid></div>

        <section class="howto" aria-labelledby="howto-title">
          <h2 class="howto__title" id="howto-title">领券与使用说明</h2>
          <div class="howto__steps">
            <div class="howto__step">
              <span class="howto__step-no">1</span>
              <strong>选择优惠券</strong>
              按品类筛选，确认门槛与有效期后点击领取。
            </div>
            <div class="howto__step">
              <span class="howto__step-no">2</span>
              <strong>自动存入账户</strong>
              领取成功即存入「我的优惠券」，无需手动激活。
            </div>
            <div class="howto__step">
              <span class="howto__step-no">3</span>
              <strong>下单勾选抵扣</strong>
              结算页勾选可用券，系统自动计算最优组合。
            </div>
            <div class="howto__step">
              <span class="howto__step-no">4</span>
              <strong>注意有效期</strong>
              过期未使用自动作废，不支持延期与转赠。
            </div>
          </div>
        </section>
      </div>
    </main>

    <div data-component="footer"></div>

    <script src="assets/js/core.js"></script>
    <script src="assets/js/data.js"></script>
    <script src="assets/js/markup.js"></script>
    <script src="assets/js/views/coupon.js"></script>
  </body>
</html>
