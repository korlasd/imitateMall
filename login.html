<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#e1251b" />
    <title>登录 — 京选商城</title>
    <meta
      name="description"
      content="京选商城登录页仿站作品：扫码登录与账户登录双模式，含表单校验与密码可见性切换。"
    />
    <link rel="stylesheet" href="assets/css/tokens.css" />
    <link rel="stylesheet" href="assets/css/layout.css" />
    <link rel="stylesheet" href="assets/css/components.css" />
    <link rel="stylesheet" href="assets/css/views/login.css" />
  </head>
  <body class="login-page">
    <header class="login-header">
      <div class="container login-header__inner">
        <a class="brand" href="index.html">
          <span class="brand__mark" aria-hidden="true">JD</span>
          <span class="brand__text">
            <span class="brand__name">京选商城</span>
            <span class="brand__slogan">JINGXUAN MALL</span>
          </span>
        </a>
        <a class="login-header__help" href="index.html">返回首页</a>
      </div>
    </header>

    <main class="login-main">
      <div class="login-card">
        <aside class="login-brand" aria-label="会员权益">
          <p class="login-brand__eyebrow">JINGXUAN MALL</p>
          <h1 class="login-brand__title">登录京选<br />享会员专属价格</h1>
          <p class="login-brand__desc">
            依据《网络安全法》要求，为保障账户安全，请完成手机号验证后再登录使用。
          </p>
          <ul class="login-brand__points">
            <li><span data-icon="check"></span>PLUS 会员日额外 95 折</li>
            <li><span data-icon="check"></span>专属客服与极速退款</li>
            <li><span data-icon="check"></span>价保自动补差，省心无忧</li>
          </ul>
          <div class="login-brand__qr">
            <img src="threeImg/3.png" alt="京选商城 App 下载二维码" width="92" height="92" />
            <p class="login-brand__qr-text">
              <strong>扫码下载 App</strong>
              新人首单立减 10 元
            </p>
          </div>
        </aside>

        <section class="login-form" aria-label="登录表单">
          <div class="login-tabs" role="tablist" aria-label="登录方式">
            <button
              type="button"
              class="login-tab is-active"
              role="tab"
              id="tab-qr"
              aria-selected="true"
              aria-controls="panel-qr"
              data-tab="qr"
            >
              扫码登录
            </button>
            <button
              type="button"
              class="login-tab"
              role="tab"
              id="tab-account"
              aria-selected="false"
              aria-controls="panel-account"
              data-tab="account"
            >
              账户登录
            </button>
          </div>

          <!-- 扫码登录 -->
          <div
            class="login-panel"
            id="panel-qr"
            role="tabpanel"
            aria-labelledby="tab-qr"
            data-panel="qr"
          >
            <div class="qr-panel">
              <div class="qr-frame">
                <img src="threeImg/3.png" alt="扫码登录二维码" width="180" height="180" />
              </div>
              <p class="qr-tip">打开 <strong>手机京选</strong> 扫一扫</p>
              <p class="qr-tip text-sm">扫码成功后请在手机端确认登录</p>
            </div>
          </div>

          <!-- 账户登录 -->
          <form
            class="login-panel"
            id="panel-account"
            role="tabpanel"
            aria-labelledby="tab-account"
            data-panel="account"
            data-login-form
            novalidate
            hidden
          >
            <div class="field" data-field="account">
              <label class="field__label" for="login-account">账号</label>
              <div class="field__control">
                <span class="field__icon" data-icon="user"></span>
                <input
                  id="login-account"
                  name="account"
                  type="text"
                  placeholder="邮箱 / 用户名 / 手机号"
                  autocomplete="username"
                />
              </div>
              <p class="field__error" data-error-for="account"></p>
            </div>

            <div class="field" data-field="password">
              <label class="field__label" for="login-password">密码</label>
              <div class="field__control">
                <span class="field__icon" data-icon="lock"></span>
                <input
                  id="login-password"
                  name="password"
                  type="password"
                  placeholder="请输入登录密码"
                  autocomplete="current-password"
                />
                <button type="button" class="field__toggle" data-toggle-password>
                  显示
                </button>
              </div>
              <p class="field__error" data-error-for="password"></p>
            </div>

            <div class="login-form__row">
              <label class="checkbox">
                <input type="checkbox" name="remember" checked />
                记住登录状态
              </label>
              <a class="login-form__link" href="#">忘记密码？</a>
            </div>

            <button class="btn btn--primary btn--block login-form__submit" type="submit">
              立即登录
            </button>

            <div class="login-form__divider">其他方式登录</div>

            <div class="login-form__oauth">
              <button type="button" class="oauth-btn" data-oauth="QQ">QQ</button>
              <button type="button" class="oauth-btn" data-oauth="微信">微信</button>
              <button type="button" class="oauth-btn" data-oauth="企业账号">
                企业账号
              </button>
            </div>

            <p class="login-form__legal">
              登录即表示同意
              <a href="#">《用户协议》</a>
              与
              <a href="#">《隐私政策》</a>
              。本页面为学习用途的仿站作品，不收集任何真实账号信息。
            </p>
          </form>
        </section>
      </div>
    </main>

    <script src="assets/js/core.js"></script>
    <script src="assets/js/markup.js"></script>
    <script src="assets/js/views/login.js"></script>
  </body>
</html>
