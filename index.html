<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#e1251b" />
    <title>京选商城 — 正品低价 · 品质生活</title>
    <meta
      name="description"
      content="京选商城首页仿站作品：商品分类、限时秒杀、优惠券、为你推荐，纯 HTML + CSS + 原生 JavaScript 实现。"
    />
    <link rel="stylesheet" href="assets/css/tokens.css" />
    <link rel="stylesheet" href="assets/css/layout.css" />
    <link rel="stylesheet" href="assets/css/components.css" />
    <link rel="stylesheet" href="assets/css/views/home.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">跳到主要内容</a>

    <!-- 页头由 core.js 的 Mall.header 组件注入 -->
    <div data-component="header"></div>

    <main id="main">
      <div class="container">
        <!-- 主视觉：分类侧栏 + 轮播 + 右侧信息 -->
        <div class="hero">
          <aside class="hero__aside hero__aside--left" aria-label="商品分类">
            <div class="cate">
              <div class="cate__head">
                <span>商品分类</span>
                <span class="text-sm text-muted">全部类目</span>
              </div>
              <ul class="cate__list" data-categories></ul>
            </div>
          </aside>

          <div class="hero__main">
            <div
              class="carousel"
              data-carousel
              data-interval="5000"
              tabindex="0"
              role="region"
              aria-roledescription="轮播"
              aria-label="促销活动"
            >
              <div class="carousel__viewport">
                <div class="carousel__track" data-hero-slides></div>
              </div>
            </div>
            <div class="banner-row" data-banner-row></div>
          </div>

          <aside
            class="hero__aside hero__aside--right"
            data-aside
            aria-label="账户信息与公告"
          ></aside>
        </div>

        <!-- 生活服务入口 -->
        <div class="section">
          <div class="promise-strip" data-promises></div>
        </div>

        <!-- 秒杀专区 -->
        <section class="floor" data-flash aria-label="京东秒杀"></section>

        <!-- 为你推荐（价格筛选） -->
        <section class="floor" data-recommend aria-label="为你推荐"></section>

        <!-- 品类楼层 -->
        <div data-floors></div>

        <!-- 品牌墙 -->
        <section class="floor" aria-labelledby="brand-title">
          <div class="floor__head">
            <h2 class="floor__title" id="brand-title">热门品牌</h2>
            <span class="floor__desc">大牌好物 一站直达</span>
          </div>
          <div class="brandwall" data-brands></div>
        </section>
      </div>
    </main>

    <!-- 页脚由 core.js 的 Mall.footer 组件注入 -->
    <div data-component="footer"></div>

    <script src="assets/js/core.js"></script>
    <script src="assets/js/data.js"></script>
    <script src="assets/js/markup.js"></script>
    <script src="assets/js/views/home.js"></script>
  </body>
</html>
